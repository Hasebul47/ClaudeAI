<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact &amp; FAQ — Bloom &amp; Hobby</title>
  <meta name="description" content="Get in touch with our team, and find answers about shipping, returns and payment.">
  <meta name="theme-color" content="#b03a6f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23b03a6f'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white'>✿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main id="main" class="container">
    <section class="page-head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">›</span><span aria-current="page">Contact</span></nav>
      <h1>We’d love to hear from you</h1>
      <p>Questions about an order, a custom gift or a hobby kit? Send us a message and we’ll reply within one business day.</p>
    </section>

    <div class="contact-grid">
      <div class="info-cards" id="info-cards"></div>

      <form class="panel" id="contact-form" novalidate aria-labelledby="form-title">
        <h2 id="form-title">Send a message</h2>
        <div class="form-row">
          <div class="field"><label for="c-name">Your name</label><input id="c-name" name="name" autocomplete="name" required data-error="Please tell us your name."></div>
          <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required data-error="Please enter a valid email address."></div>
        </div>
        <div class="field">
          <label for="c-topic">Topic</label>
          <select id="c-topic" name="topic">
            <option>Order question</option>
            <option>Returns &amp; exchanges</option>
            <option>Personalised / custom gift</option>
            <option>Product question</option>
            <option>Something else</option>
          </select>
        </div>
        <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message" required minlength="10" data-error="Please write at least 10 characters."></textarea></div>
        <button class="btn btn--primary" type="submit">Send message</button>
      </form>
    </div>

    <section class="section--tight" id="faq" aria-labelledby="faq-title" style="padding-bottom:64px">
      <div class="section__head"><div><span class="eyebrow">Help centre</span><h2 id="faq-title">Frequently asked questions</h2></div></div>
      <div class="faq" id="faq-list"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var A = window.App, S = A.S;
      var cards = [
        ['phone', 'Call us', '<a href="tel:' + S.contact.phone.replace(/[^+\d]/g, '') + '">' + A.esc(S.contact.phone) + '</a>'],
        ['mail', 'Email', '<a href="mailto:' + A.esc(S.contact.email) + '">' + A.esc(S.contact.email) + '</a>'],
        ['pin', 'Visit our studio', '<span>' + A.esc(S.contact.address) + '</span>'],
        ['clock', 'Opening hours', '<span>' + A.esc(S.contact.hours) + '</span>']
      ];
      A.$('#info-cards').innerHTML = cards.map(function (c) {
        return '<div class="info-card"><span class="perk__icon">' + A.icon(c[0]) + '</span><div><b>' + c[1] + '</b>' + c[2] + '</div></div>';
      }).join('');

      var faqs = [
        ['How long does delivery take?', S.shipping.standard.label + ' takes ' + S.shipping.standard.eta + ' and costs ' + A.money(S.shipping.standard.price) + ' (free on orders over ' + A.money(S.freeShippingThreshold) + '). ' + S.shipping.express.label + ' takes ' + S.shipping.express.eta + ' for ' + A.money(S.shipping.express.price) + '.'],
        ['What is your returns policy?', 'You can return or exchange any unused item in its original packaging within 7 days of delivery. Personalised items can only be returned if they arrive damaged or incorrect.'],
        ['Which payment methods do you accept?', 'We accept cash on delivery, major credit and debit cards, and popular mobile wallets.'],
        ['Can I add a gift message or gift wrapping?', 'Yes! Tick “Add free gift wrapping” at checkout and write your message in the order notes. We never include prices in gift parcels.'],
        ['How do I order a personalised item?', 'Add the item to your cart and type the name or text you’d like in the order notes at checkout. We’ll email you a preview before it’s made.'],
        ['Are your hobby kits suitable for beginners?', 'Most of our kits are designed for complete beginners and include step-by-step guides. Check each product’s Details tab for what’s included.']
      ];
      A.$('#faq-list').innerHTML = faqs.map(function (f, i) {
        return '<details' + (i === 0 ? ' open' : '') + '><summary>' + A.esc(f[0]) + A.icon('chevronDown') + '</summary><p>' + A.esc(f[1]) + '</p></details>';
      }).join('');

      var form = A.$('#contact-form');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!A.validateForm(form)) return;
        // No backend needed: hand the message to the visitor's email app.
        // To receive messages directly instead, point the form at a service such as Formspree (see README).
        var subject = '[' + form.topic.value + '] Message from ' + form.name.value.trim();
        var body = form.message.value.trim() + '\n\n— ' + form.name.value.trim() + ' (' + form.email.value.trim() + ')';
        window.location.href = 'mailto:' + S.contact.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        A.toast('Opening your email app to send the message…', { type: 'success', duration: 5000 });
        form.reset();
      });
    })();
  </script>
</body>
</html>
