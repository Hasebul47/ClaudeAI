<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wishlist — Bloom &amp; Hobby</title>
  <meta name="theme-color" content="#b03a6f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23b03a6f'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white'>✿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="wishlist">
  <div id="site-header"></div>

  <main id="main" class="container" style="padding-bottom:64px">
    <section class="page-head" style="margin-bottom:20px">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">›</span><span aria-current="page">Wishlist</span></nav>
      <h1>Your wishlist</h1>
      <p id="wish-sub">Items you’ve saved for later.</p>
    </section>
    <div id="wish-actions" style="margin-bottom:18px" hidden>
      <button class="btn btn--dark btn--sm" type="button" id="add-all">Add all to cart</button>
    </div>
    <div class="grid" id="wish-grid"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var A = window.App;
      function render() {
        var items = A.getWishlist().map(A.byId);
        var grid = A.$('#wish-grid');
        A.$('#wish-sub').textContent = items.length
          ? items.length + ' saved item' + (items.length === 1 ? '' : 's') + '. Tap the heart to remove an item.'
          : 'Items you’ve saved for later.';
        A.$('#wish-actions').hidden = !items.some(function (p) { return p.stock > 0; });
        if (!items.length) {
          grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty__icon">' + A.icon('heart') +
            '</div><p class="empty__title">Your wishlist is empty</p><p>Tap the heart on any product to save it here for later.</p>' +
            '<a class="btn btn--primary" href="shop.html">Discover products</a></div>';
          return;
        }
        A.renderGrid(grid, items);
      }
      A.$('#add-all').addEventListener('click', function () {
        A.getWishlist().map(A.byId).filter(function (p) { return p.stock > 0; })
          .forEach(function (p) { if (A.qtyInCart(p.id) === 0) A.addToCart(p.id, 1); });
        A.openDrawer('cart');
      });
      document.addEventListener('wishlist:change', render);
      render();
    })();
  </script>
</body>
</html>
